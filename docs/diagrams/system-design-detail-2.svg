<g class="c-amber"><circle cx="320" cy="114" r="9" stroke-width="0.5"/><text class="ts" x="320" y="114" text-anchor="middle" dominant-baseline="central">12</text></g>
<rect class="box" x="420" y="164" width="240" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="180" text-anchor="middle" dominant-baseline="central">Google sign-in</text>
<text class="ts" x="540" y="198" text-anchor="middle" dominant-baseline="central">HTTPS: verify the ID token</text>
