<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img">
<style>
svg{--b:#b4b2a9}
text{font-family:"Segoe UI",Arial,sans-serif;fill:#2c2c2a}
.th{font-size:14px;font-weight:600}.ts{font-size:12px;fill:#5f5e5a}
.box{fill:#f7f6f2;stroke:#888780;stroke-width:.8}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.c-teal rect{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.8}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0f6e56}
.c-purple rect{fill:#eeedfe;stroke:#534ab7;stroke-width:.8}.c-purple .th{fill:#3c3489}.c-purple .ts{fill:#534ab7}
.c-amber circle{fill:#faeeda;stroke:#854f0b;stroke-width:.8}.c-amber .ts{fill:#633806;font-weight:600}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="20" y="30" width="200" height="260" rx="16" stroke-width="0.5"/>
<text class="th" x="120" y="54" text-anchor="middle" dominant-baseline="central">Core service</text>
<text class="ts" x="120" y="72" text-anchor="middle" dominant-baseline="central">api.shazlo.store</text>
</g>
<rect class="box" x="420" y="44" width="240" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="60" text-anchor="middle" dominant-baseline="central">Modal (CLIP)</text>
<text class="ts" x="540" y="78" text-anchor="middle" dominant-baseline="central">HTTPS: image URL in, vector out</text>
