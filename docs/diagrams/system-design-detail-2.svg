<g class="c-amber"><circle cx="320" cy="354" r="9" stroke-width="0.5"/><text class="ts" x="320" y="354" text-anchor="middle" dominant-baseline="central">15</text></g>
<rect class="box" x="420" y="404" width="240" height="48" rx="8" stroke-width="0.5"/>
