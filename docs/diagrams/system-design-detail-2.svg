<text class="ts" x="540" y="438" text-anchor="middle" dominant-baseline="central">portal uploads, app loads images</text>
<line class="arr" x1="222" y1="428" x2="418" y2="428" marker-end="url(#arrow)"/>
<g class="c-amber"><circle cx="320" cy="414" r="9" stroke-width="0.5"/><text class="ts" x="320" y="414" text-anchor="middle" dominant-baseline="central">16</text></g>
<rect class="box" x="420" y="464" width="240" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="480" text-anchor="middle" dominant-baseline="central">WhatsApp</text>
<text class="ts" x="540" y="498" text-anchor="middle" dominant-baseline="central">click-to-chat links, no API</text>
<line class="arr" x1="222" y1="488" x2="418" y2="488" marker-end="url(#arrow)"/>
<g class="c-amber"><circle cx="320" cy="474" r="9" stroke-width="0.5"/><text class="ts" x="320" y="474" text-anchor="middle" dominant-baseline="central">17</text></g>
</svg>