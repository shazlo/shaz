<g class="c-amber"><circle cx="320" cy="54" r="9" stroke-width="0.5"/><text class="ts" x="320" y="54" text-anchor="middle" dominant-baseline="central">11</text></g>
<rect class="box" x="420" y="104" width="240" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="120" text-anchor="middle" dominant-baseline="central">Firebase Cloud Messaging</text>
<text class="ts" x="540" y="138" text-anchor="middle" dominant-baseline="central">HTTPS push to the phone</text>
