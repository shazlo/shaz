[project]
name = "shazlo-server"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.0,<6.1",
    "django-environ",
    "django-cors-headers",
    "django-ninja",
    "strawberry-graphql-django",
    "whitenoise",
    "psycopg[binary,pool]",
    "redis",
    "celery[redis]",
    "gunicorn",
    "uvicorn-worker",
    "structlog",
    "httpx",
    "pyjwt",
    "google-auth",
    "boto3",
    "razorpay",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-django",
    "opentelemetry-instrumentation-psycopg",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-celery",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-botocore",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "django-stubs[compatible-mypy]",
    "celery-types",
    "pytest",
    "pytest-django",
    "factory-boy",
    "pre-commit",
    "import-linter>=2.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]
"config/django/*" = ["F403", "F405"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.django.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.django.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.importlinter]
root_packages = ["shazlo"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layers only depend downward"
type = "layers"
layers = [
    "shazlo.api",
    "shazlo.orders | shazlo.feed",
    "shazlo.catalog",
    "shazlo.auth",
    "shazlo.users",
    "shazlo.integrations",
    "shazlo.core",
]

[[tool.importlinter.contracts]]
name = "Pure logic stays framework free"
type = "forbidden"
source_modules = ["shazlo.feed.taste", "shazlo.feed.mix"]
forbidden_modules = ["django", "strawberry", "strawberry_django", "redis", "celery", "ninja"]
